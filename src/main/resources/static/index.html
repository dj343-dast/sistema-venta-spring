<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistema de Ventas e Inventario</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
  <header class="barra">
    <h1>Sistema de Ventas e Inventario</h1>
    <nav id="menu">
      <button data-ent="clientes" class="activo">Clientes</button>
      <button data-ent="categorias">Categorías</button>
      <button data-ent="proveedores">Proveedores</button>
      <button data-ent="productos">Productos</button>
    </nav>
  </header>

  <main class="contenedor">
    <section class="tarjeta">
      <h2 id="tituloForm">Registrar cliente</h2>
      <form id="formulario" novalidate>
        <div id="campos" class="rejilla"></div>
        <div id="errores" class="errores" role="alert" hidden></div>
        <div class="acciones">
          <button type="submit" class="primario" id="btnGuardar">Guardar</button>
          <button type="button" class="secundario" id="btnCancelar">Cancelar</button>
        </div>
      </form>
    </section>

    <section class="tarjeta">
      <h2 id="tituloLista">Lista de clientes</h2>
      <div id="aviso" class="aviso" hidden></div>
      <div class="tabla-caja">
        <table>
          <thead id="encabezado"></thead>
          <tbody id="filas"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>

</html>
